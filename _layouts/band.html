---
layout: compress
---
<!DOCTYPE html>
<html lang="de">

  {% include head.html %}
  <style>
    /* HERO */
    .band-hero{position:relative;min-height:26rem;display:flex;align-items:flex-end;margin-top:3.75rem;overflow:hidden;background:#1a1a1a}
    .band-hero__img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(100%);opacity:.6}
    .band-hero__overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.85) 0%,rgba(0,0,0,.2) 60%,transparent 100%)}
    .band-hero__content{position:relative;z-index:1;padding:2rem 1.5rem}
    .band-hero__title{font-size:2.5rem;font-weight:800;color:#fff;margin:0 0 .3rem;text-shadow:0 2px 8px rgba(0,0,0,.5)}
    .band-hero__zeitraum{font-size:1rem;color:rgba(255,255,255,.7);margin:0 0 .75rem}
    .band-hero__btn{display:inline-block;margin-top:.75rem;padding:.45rem 1rem;border:1.5px solid rgba(255,255,255,.7);border-radius:4px;font-size:.8rem;color:#fff;text-decoration:none;backdrop-filter:blur(4px);background:rgba(255,255,255,.1);transition:background .2s,border-color .2s}
    .band-hero__btn:hover{background:rgba(255,255,255,.2);border-color:#fff}
    @media(min-width:62em){.band-hero{margin-top:0;min-height:34rem}.band-hero__title{font-size:3.5rem}.band-hero__content{padding:3rem 2rem}}
    .band-kontext{background:#f9f9f7;border-left:3px solid #313237;padding:1.25rem 1.5rem;margin-bottom:2rem;border-radius:0 6px 6px 0}
    .band-kontext p{font-size:.95rem;line-height:1.7;color:#444;margin:0}

    /* ZEITSTRAHL */
    .zeitstrahl{padding:2rem 0}
    .zeitstrahl__eintrag{display:grid;grid-template-columns:4rem 1fr;gap:0 1.5rem;margin-bottom:0}
    .zeitstrahl__jahr-wrap{display:flex;flex-direction:column;align-items:center}
    .zeitstrahl__jahr{font-size:.9rem;font-weight:700;color:#313237;padding:.2rem 0;display:flex;align-items:center;gap:.25rem}
    .zeitstrahl__jahr::before,.zeitstrahl__jahr::after{content:'';display:inline-block;width:16px;height:16px;background:url('{{ "/assets/img/stern.webp" | relative_url }}') center/contain no-repeat;mix-blend-mode:multiply;flex-shrink:0}
    .zeitstrahl__linie{flex:1;width:2px;background:#e0e0e0;margin:.3rem 0}
    .zeitstrahl__eintrag:last-child .zeitstrahl__linie{display:none}
    .zeitstrahl__inhalt{padding:.1rem 0 2.5rem}
    .zeitstrahl__punkt{display:inline-block;width:10px;height:10px;border-radius:50%;background:#313237;margin-top:.35rem;position:absolute;margin-left:-1.8rem}

    /* SCREENSHOT GRID */
    .screenshot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;margin-top:1rem}
    @media(min-width:40em){.screenshot-grid{grid-template-columns:repeat(4,1fr)}}
    @media(min-width:62em){.screenshot-grid{grid-template-columns:repeat(5,1fr)}}
    .screenshot-item{display:block;border-bottom:none;text-decoration:none;border-radius:6px;overflow:hidden;background:#f0f0ee;transition:box-shadow .2s}
    .screenshot-item:hover{box-shadow:0 4px 14px rgba(0,0,0,.15)}
    .screenshot-item img{width:100%;display:block;aspect-ratio:4/3;object-fit:cover}
    .screenshot-item__label{display:block;font-size:.65rem;color:#555;padding:.4rem .5rem;line-height:1.3}

    /* STERN */
    .stern{display:inline-block;width:20px;height:20px;background:url('{{ "/assets/img/stern.webp" | relative_url }}') center/contain no-repeat;mix-blend-mode:multiply;vertical-align:middle;margin-right:.3rem}

    /* UPDATES */
    .update{margin-bottom:1rem;padding:1rem 1.2rem;background:#f9f9f7;border-radius:6px;border-left:3px solid #313237}
    .update__kategorie{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#888;margin-bottom:.3rem}
    .update__text{font-size:.9rem;color:#313237;margin:0}
    .update__link{font-size:.8rem;color:#277cea;display:inline-block;margin-top:.4rem}
  </style>

  <body class="site">

    {% include header.html %}

    <div class="band-hero">
      <img class="band-hero__img" src="{{ page.bild | relative_url }}" alt="{{ page.band }}">
      <div class="band-hero__overlay"></div>
      <div class="band-hero__content container">
        <h1 class="band-hero__title">{{ page.band }}</h1>
        <p class="band-hero__zeitraum">{{ page.zeitraum }}</p>
        {% if page.aktuelle_website %}
        <a class="band-hero__btn" href="{{ page.aktuelle_website }}" target="_blank" rel="noopener">Aktuelle Website ↗</a>
        {% endif %}
      </div>
    </div>

    <main class="site__content">
      <div class="container">
        {% if page.beschreibung %}
        <div class="band-kontext">
          <p>{{ page.beschreibung }}</p>
        </div>
        {% endif %}
        <div class="zeitstrahl">
          {{ content }}
        </div>
      </div>
    </main>

    {% include footer.html %}

  </body>

</html>
