---
layout: compress
---
<!DOCTYPE html>
<html lang="de">

  {% include head.html %}

  <body class="site">

    {% include header.html %}

    <div class="hero--small">
      <div class="hero__wrap">
        <h1 class="hero__title">{{ page.titel }}</h1>
        <p style="color:rgba(255,255,255,.7);margin:0">{{ page.parent_title }}</p>
      </div>
    </div>

    <main class="site__content">
      <div class="container">
        <div class="kat-page">
          <a class="kat-page__back" href="{{ page.parent_url | relative_url }}">← Zurück zu {{ page.parent_title }}</a>

          <div class="archiv-eintraege">
            {{ content }}
          </div>

        </div>
      </div>
    </main>

    {% include footer.html %}

  </body>

</html>
