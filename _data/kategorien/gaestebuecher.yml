beschreibung: >
  Gästebücher, Chatrooms und Message Boards waren die ersten interaktiven Räume
  auf Bandwebsites – Vorläufer heutiger Social-Media-Kommentarspalten.

eintraege:
  - band: "Oasis"
    jahr: 1997
    beschreibung: "Das Gästebuch auf oasisinet.com war eines der meistbesuchten der britischen Musikszene – Fans aus aller Welt hinterließen Nachrichten."
    url: "http://www.oasisinet.com/"
    datetime: "1997"

  - band: "Spice Girls"
    jahr: 1998
    beschreibung: "spicegirls.com betrieb ein aktives Gästebuch mit tausenden Einträgen – ein früher Beweis für die globale Reichweite der Band."
    url: "http://www.spicegirls.com/"
    datetime: "1998"

  - band: "Backstreet Boys"
    jahr: 1999
    beschreibung: "Das Backstreet Boys Message Board war eines der größten fan-betriebenen Foren der späten 90er – direkt von der offiziellen Website verlinkt."
    url: "http://www.backstreetboys.com/"
    datetime: "1999"

  - band: "Radiohead"
    jahr: 2000
    beschreibung: "Radiohead betrieb einen eigenen IRC-Chatroom, verlinkt über radiohead.com – Fans diskutierten dort Songtexte, Theorien und Konzertmitschnitte."
    url: "http://www.radiohead.com/"
    datetime: "2000"

  - band: "ABBA"
    jahr: 2001
    beschreibung: "Im Zuge des Mamma Mia!-Hypes entstand auf abba.com ein Forum, in dem Fans über Covers und Tribute-Acts diskutierten."
    url: "http://www.abba.com/"
    datetime: "2001"

  - band: "Arctic Monkeys"
    jahr: 2005
    beschreibung: "Arctic Monkeys verdankten ihren frühen Erfolg zum Teil den Foren auf arcticmonkeys.com – hier wurden Demo-Tapes diskutiert, bevor die Band einen Plattenvertrag hatte."
    url: "http://www.arcticmonkeys.com/"
    datetime: "2005"

  - band: "Beatles"
    jahr: 2000
    beschreibung: "Das offizielle Beatles-Forum auf beatles.com wurde zu einem Archiv für Fans der ersten Stunde – ältere Fans und jüngere Generationen diskutierten gemeinsam das Erbe der Band."
    url: "http://www.beatles.com/"
    datetime: "2000"

  - band: "One Direction"
    jahr: 2012
    beschreibung: "onedirectionmusic.com integrierte ein Community-Forum – ein Dokument des Übergangs von Foren zu Social Media."
    url: "http://www.onedirectionmusic.com/"
    datetime: "2012"

  - band: "Taylor Swift"
    jahr: 2009
    beschreibung: "Auf taylorswift.com gab es in den frühen Jahren ein aktives Fan-Forum, bevor die Community auf Tumblr und später TikTok abwanderte."
    url: "http://www.taylorswift.com/"
    datetime: "2009"