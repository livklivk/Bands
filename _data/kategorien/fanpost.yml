beschreibung: >
  Lange bevor Social Media direkte Kommunikation ermöglichte, veröffentlichten
  Bands auf ihren Websites postalische Adressen für Fanpost.

eintraege:
  - band: "Beatles"
    jahr: 1996
    beschreibung: "The Beatles official website listete eine Fanpost-Adresse in London auf – Tradition aus den 60er-Jahren, jetzt im Web verewigt."
    url: "http://www.beatles.com/"
    datetime: "1996"

  - band: "Oasis"
    jahr: 1997
    beschreibung: "oasisinet.com veröffentlichte eine postalische Management-Adresse, an die Fans Briefe schicken konnten."
    url: "http://www.oasisinet.com/"
    datetime: "1997"

  - band: "Spice Girls"
    jahr: 1997
    beschreibung: "Die Spice Girls Website listete sowohl eine postalische Fanpost-Adresse als auch frühe E-Mail-Kontaktmöglichkeiten."
    url: "http://www.spicegirls.com/"
    datetime: "1997"

  - band: "Backstreet Boys"
    jahr: 1999
    beschreibung: "backstreetboys.com hatte eine dedizierte Kontaktseite mit postalischer Adresse sowie Anleitung, wie man Fanpost korrekt adressiert."
    url: "http://www.backstreetboys.com/"
    datetime: "1999"

  - band: "ABBA"
    jahr: 2001
    beschreibung: "Die offizielle ABBA-Website stellte klare Anweisungen für Fanpost bereit und trennte zwischen allgemeinen Anfragen und Post an einzelne Bandmitglieder."
    url: "http://www.abba.com/"
    datetime: "2001"

  - band: "Arctic Monkeys"
    jahr: 2006
    beschreibung: "Mit ihrem rasanten Aufstieg erschien auch auf arcticmonkeys.com eine Kontaktadresse – obwohl die Band damals für ihre Zurückhaltung gegenüber Fan-Interaktionen bekannt war."
    url: "http://www.arcticmonkeys.com/"
    datetime: "2006"

  - band: "One Direction"
    jahr: 2019
    beschreibung: "onedirectionmusic.com führte ein strukturiertes Kontaktformular ein – postalische Fanpost-Adressen wurden durch digitale Anfrage-Formulare ergänzt."
    url: "http://www.onedirectionmusic.com/"
    datetime: "2019"

  - band: "Radiohead"
    jahr: 2003
    beschreibung: "radiohead.com listete auf seiner Kontaktseite Management- und Label-Adressen – persönliche Fanpost-Adressen wurden bewusst nicht veröffentlicht."
    url: "http://www.radiohead.com/"
    datetime: "2003"
