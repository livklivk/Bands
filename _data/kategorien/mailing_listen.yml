beschreibung: >
  Mailing-Listen waren eine der ersten Formen digitaler Fan-Kommunikation.
  Bands boten auf ihren Websites E-Mail-Verteiler an, über die Fans Neuigkeiten,
  Tour-Daten und Exklusiv-Inhalte direkt ins Postfach bekamen.

eintraege:
  - band: "Oasis"
    jahr: 1996
    beschreibung: "Oasis boten auf ihrer frühen Website oasisinet.com eine E-Mail-Liste für Fans an – Neuigkeiten zu Touren und Veröffentlichungen direkt ins Postfach."
    url: "http://www.oasisinet.com/"
    datetime: "1996"

  - band: "Radiohead"
    jahr: 1997
    beschreibung: "Radioheads offizielle Site verlinkle einen Newsletter-Service, über den Fans Updates zu 'OK Computer' und der zugehörigen Tour erhielten."
    url: "http://www.radiohead.com/"
    datetime: "1997"

  - band: "Spice Girls"
    jahr: 1997
    beschreibung: "Die offizielle Spice Girls Website warb aktiv für ihren E-Mail-Newsletter – mit exklusiven Updates und Gewinnspielen für Abonnenten."
    url: "http://www.spicegirls.com/"
    datetime: "1997"

  - band: "Backstreet Boys"
    jahr: 1998
    beschreibung: "backstreetboys.com listete eine Mailing-Liste prominent auf der Startseite – Fans konnten sich mit ihrer E-Mail-Adresse registrieren."
    url: "http://www.backstreetboys.com/"
    datetime: "1998"

  - band: "ABBA"
    jahr: 1999
    beschreibung: "Die offizielle ABBA-Website bot einen Newsletter für Neuigkeiten rund um die Band."
    url: "http://www.abba.com/"
    datetime: "1999"

  - band: "Arctic Monkeys"
    jahr: 2006
    beschreibung: "Nach ihrem Durchbruch 2006 boten Arctic Monkeys auf arcticmonkeys.com eine Mailing-Liste an – damals noch parallel zu ersten MySpace-Aktivitäten."
    url: "http://www.arcticmonkeys.com/"
    datetime: "2006"

  - band: "One Direction"
    jahr: 2011
    beschreibung: "Nach der X Factor-Zeit bot onedirectionmusic.com einen offiziellen Newsletter an – neben Social Media noch immer ein wichtiger Kanal für die 'Directioners'."
    url: "http://www.onedirectionmusic.com/"
    datetime: "2011"

  - band: "Taylor Swift"
    jahr: 2014
    beschreibung: "taylorswift.com setzte gezielt einen E-Mail-Newsletter ein, um vor Social-Media-Ankündigungen exklusive Infos an treue Fans zu senden ('Taylor Nation')."
    url: "http://www.taylorswift.com/"
    datetime: "2014"

  - band: "BTS"
    jahr: 2020
    beschreibung: "Weverse und der offizielle BTS-Newsletter kombinieren klassische Mailing-Listen-Logik mit modernen Fan-Community-Plattformen."
    url: "https://www.bts.com/"
    datetime: "2020"
