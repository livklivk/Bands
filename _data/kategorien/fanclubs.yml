beschreibung: >
  Offizielle Fanclubs ermöglichten Fans eine formale Mitgliedschaft mit Vorteilen
  wie Presale-Tickets, exklusiven Merchandise-Artikeln und direkten Band-Updates.

eintraege:
  - band: "Beatles"
    jahr: 1996
    beschreibung: "The Beatles Official Fan Club hatte bereits früh eine Web-Präsenz – eine direkte Fortsetzung des legendären Briefpost-Fanclubs aus den 1960ern."
    url: "http://www.beatles.com/"
    datetime: "1996"

  - band: "Oasis"
    jahr: 1997
    beschreibung: "Der Official Oasis Fan Club bot auf oasisinet.com Mitgliedschaften an – inklusive Mitgliedsausweis, Poster und exklusivem Newsletter."
    url: "http://www.oasisinet.com/"
    datetime: "1997"

  - band: "Spice Girls"
    jahr: 1998
    beschreibung: "Der offizielle Spice Girls Fan Club verknüpfte die physische Mitgliedschaft mit der Website – Fans konnten sich online anmelden."
    url: "http://www.spicegirls.com/"
    datetime: "1998"

  - band: "ABBA"
    jahr: 2000
    beschreibung: "ABBA hatten bereits in den 70ern offizielle Fanclubs – die Website abba.com führte diese Tradition ins digitale Zeitalter fort."
    url: "http://www.abba.com/"
    datetime: "2000"

  - band: "Radiohead"
    jahr: 2001
    beschreibung: "W.A.S.T.E. – Radioheads offizieller Fan-Community-Bereich – bot Mitgliedschaften mit exklusiven Downloads und Merchandise."
    url: "http://www.radiohead.com/"
    datetime: "2001"

  - band: "Arctic Monkeys"
    jahr: 2007
    beschreibung: "Nach ihrem Erfolg richteten Arctic Monkeys einen offiziellen Fan-Bereich ein – mit Presale-Zugang und exklusiven Inhalten für Mitglieder."
    url: "http://www.arcticmonkeys.com/"
    datetime: "2007"

  - band: "One Direction"
    jahr: 2012
    beschreibung: "Der 1D Fan Club bot Presale-Tickets, exklusive Merchandise-Pakete und direkten Zugang zu Band-Updates."
    url: "http://www.onedirectionmusic.com/"
    datetime: "2012"

  - band: "Taylor Swift"
    jahr: 2019
    beschreibung: "Taylor Nation – Swifts inoffiziell-offizielle Fan-Community – wurde über die Website koordiniert und bot Superfans einzigartige Meet-and-Greet-Möglichkeiten."
    url: "http://www.taylorswift.com/"
    datetime: "2019"
