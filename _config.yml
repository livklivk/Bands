# SITE CONFIGURATION
title: Bands & Fans im Web
author: Olivia Kinsey
lang: de
description: >
  Drei ikonische britische Bands aus drei verschiedenen Jahrzehnten und eine Frage: Wie haben Bands über ihre offiziellen Websites mit Fans interagiert und wie hat sich das im Laufe der Zeit verändert? Dieses Archiv versammelt Momentaufnahmen aus den Websites von Oasis, One Direction und The Beatles und macht alte Versionen ihrer Homepages zugänglich. Über die Bands oder die verschiedenen Feature-Kategorien lässt sich erkunden, wie Mailing-Listen, Gewinnspiele, Foren und mehr die Beziehung zwischen Band und Fan geprägt haben.
baseurl: "/Bands" # the subpath of your site, e.g. /blog
url: "https://livklivk.github.io" # the base hostname & protocol for your site, e.g. http://example.com

# SEO PLUGIN
social:
  name: Your Name
  links:
    - https://twitter.com/BenBalter
    - https://www.facebook.com/ben.balter
    - https://www.linkedin.com/in/BenBalter
    - https://plus.google.com/+BenBalter
    - https://github.com/benbalter
    - https://keybase.io/benbalter

# THEME SETTINGS
navigation:
  - {name: 'Home', link: '/'}
  - {name: 'Mailing-Listen', link: '/mailing-listen/'}
  - {name: 'Fanclubs', link: '/fanclubs/'}
  - {name: 'Fanpost', link: '/fanpost/'}
  - {name: 'Gästebücher & Foren', link: '/gaestebuecher/'}

tagline: >
  Fan-Interaktionen auf Band-Websites von den 90er-Jahren bis heute

hero_img: posts/sleek_lg.jpg # Main background image: use the path from /assets/img/ => This will output /assets/img/posts/sleek_lg.jpg

email: your-email@domain.com # email for form submission

disqus:
  shortname: janczizikow # to enable comments replace with your_disqus_shortname

# google_tag_manager: GTM-XXXXXXX # Uncomment to enable GTM. Replace GTM-XXXXXXX with your GTM container ID

service_worker: true

# BUILD SETTINGS
markdown: kramdown
highlighter: rouge # or pygments or null
# theme: jekyll-sleek # Uncomment if you're using the theme as a ruby gem
exclude:
  - README.md
  - node_modules
  - script
  - package.json
  - package-lock.json
  - Gemfile
  - Gemfile.lock
  - vendor
  - npm-debug.log
  - gulpfile.js
  - sleek.jpg

include: ['_pages']
permalink: /:title/

compress_html:
  clippings: all

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
