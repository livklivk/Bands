<header class="header" itemscope itemtype="http://schema.org/SiteNavigationElement" aria-label="Main navigation">
  <style>
    .header__link--dropdown{position:relative}
    .dropdown-menu{display:none;position:absolute;top:100%;left:50%;transform:translateX(-50%);background:#fff;border:1px solid #e8e8e8;border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.12);min-width:200px;z-index:100;padding:.4rem 0;margin-top:.5rem}
    .dropdown-menu::before{content:'';position:absolute;top:-6px;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top:none;border-bottom-color:#e8e8e8}
    .dropdown-menu::after{content:'';position:absolute;top:-5px;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top:none;border-bottom-color:#fff}
    .dropdown-menu a{display:block;padding:.5rem 1rem;font-size:.85rem;color:#313237;text-decoration:none;border-bottom:none;white-space:nowrap}
    .dropdown-menu a:hover{background:#f5f5f3;color:#000}
    .header__link--dropdown.open .dropdown-menu{display:block}
    .dropdown-arrow{font-size:.6rem;margin-left:.3rem;opacity:.6}
  </style>
  <div class="container">
    <div class="header__inner">
      <a class="header__logo" href="{{ '/' | relative_url }}">
        <div class="header__logo--container">
          <span style="font-size:1.1rem;font-weight:700;color:#fff;letter-spacing:-.01em;">Bands &amp; Fans</span>
        </div>
      </a>
      <nav class="header__links">
        <div class="container header__links-wrapper">
          <a class="header__link" href="{{ '/' | relative_url }}">Home</a>
          <a class="header__link" href="{{ '/bands/oasis/' | relative_url }}">Oasis</a>
          <a class="header__link" href="{{ '/bands/one-direction/' | relative_url }}">One Direction</a>
          <a class="header__link" href="{{ '/bands/beatles/' | relative_url }}">The Beatles</a>
          <span class="header__link header__link--dropdown" id="kat-dropdown" style="cursor:pointer">
            Kategorien <span class="dropdown-arrow">▼</span>
            <div class="dropdown-menu">
              <a href="{{ '/mailing-listen/' | relative_url }}">Mailing-Listen &amp; Newsletter</a>
              <a href="{{ '/fanpost/' | relative_url }}">Fanpost &amp; Kontakt</a>
              <a href="{{ '/wettbewerbe/' | relative_url }}">Wettbewerbe &amp; Gewinnspiele</a>
              <a href="{{ '/spiele/' | relative_url }}">Spiele &amp; Interaktive Features</a>
              <a href="{{ '/gaestebuecher/' | relative_url }}">Gästebücher, Chats &amp; Foren</a>
            </div>
          </span>
        </div>
      </nav>
      <div class="header__toggle">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </div>
</header>
<script>
  var dd = document.getElementById('kat-dropdown');
  dd.addEventListener('click', function(e) {
    e.stopPropagation();
    dd.classList.toggle('open');
  });
  document.addEventListener('click', function() {
    dd.classList.remove('open');
  });
</script>
